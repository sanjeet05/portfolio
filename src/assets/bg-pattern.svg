<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Diamond arms forming a continuous lattice when tiled -->
  <line x1="30" y1="0"  x2="60" y2="30" stroke="#BD5D38" stroke-opacity="0.09" stroke-width="0.8"/>
  <line x1="60" y1="30" x2="30" y2="60" stroke="#BD5D38" stroke-opacity="0.09" stroke-width="0.8"/>
  <line x1="30" y1="0"  x2="0"  y2="30" stroke="#BD5D38" stroke-opacity="0.09" stroke-width="0.8"/>
  <line x1="0"  y1="30" x2="30" y2="60" stroke="#BD5D38" stroke-opacity="0.09" stroke-width="0.8"/>
  <!-- Dots at diamond vertices -->
  <circle cx="30" cy="0"  r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="0"  cy="30" r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="60" cy="30" r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="30" cy="60" r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <!-- Corner dots -->
  <circle cx="0"  cy="0"  r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="60" cy="0"  r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="0"  cy="60" r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <circle cx="60" cy="60" r="2"   fill="#BD5D38" fill-opacity="0.22"/>
  <!-- Subtle centre accent -->
  <circle cx="30" cy="30" r="1.3" fill="#BD5D38" fill-opacity="0.12"/>
</svg>
